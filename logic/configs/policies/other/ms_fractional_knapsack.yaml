# =============================================================================
# Mandatory Strategy: Density-Greedy 0/1 Multiple-Knapsack
# =============================================================================
# Packs bins by net-profit density and returns the better of the greedy
# solution and the best single bin (1/2-approximation). Unset values fall back
# to the simulation context.
# =============================================================================

default:
  strategy: fractional_knapsack
  n_vehicles: 1
  cost_per_km: 1.0
